name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: |
          UNIVERSAL=1 scripts/build-app.sh release
          cd build && ditto -c -k --keepParent "Bucket Browser.app" BucketBrowser.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BucketBrowser-app
          path: build/BucketBrowser.zip
